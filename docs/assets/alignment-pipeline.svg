<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455"><rect width="1200" height="455" rx="18" fill="#f7fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker></defs><g font-family="Arial,DejaVu Sans,sans-serif"><text x="40" y="50" font-size="29" font-weight="bold" fill="#152c43">CLOSED-LOOP AXLE ALIGNMENT</text><text x="40" y="82" font-size="18" font-weight="normal" fill="#5b7186">A geometric target is re-estimated after the robot moves.</text><rect x="40" y="115" width="236" height="240" rx="14" fill="white" stroke="#dce5ed"/><text x="62" y="150" font-size="21" font-weight="bold" fill="#152c43">01  Observe</text><text x="62" y="182" font-size="16" font-weight="normal" fill="#5b7186">Transform the four scans</text><g transform="translate(160 265) rotate(-14)"><rect x="-35" y="-53" width="70" height="106" rx="14" fill="#dce5ed" stroke="#8499ad"/><path d="M0,-75 V75" stroke="#087f8c" stroke-dasharray="5 5"/><circle cx="-36" cy="-32" r="2.8" fill="#f0a343"/><circle cx="-36" cy="-28" r="2.8" fill="#f0a343"/><circle cx="-36" cy="-25" r="2.8" fill="#f0a343"/><circle cx="-36" cy="-22" r="2.8" fill="#f0a343"/><circle cx="-36" cy="-18" r="2.8" fill="#f0a343"/><circle cx="36" cy="-32" r="2.8" fill="#f0a343"/><circle cx="36" cy="-28" r="2.8" fill="#f0a343"/><circle cx="36" cy="-25" r="2.8" fill="#f0a343"/><circle cx="36" cy="-22" r="2.8" fill="#f0a343"/><circle cx="36" cy="-18" r="2.8" fill="#f0a343"/></g><path d="M280,240 L326,240" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="334" y="115" width="236" height="240" rx="14" fill="white" stroke="#dce5ed"/><text x="356" y="150" font-size="21" font-weight="bold" fill="#152c43">02  Estimate</text><text x="356" y="182" font-size="16" font-weight="normal" fill="#5b7186">Tire centers → axle target</text><g transform="translate(454 265) rotate(-14)"><rect x="-35" y="-53" width="70" height="106" rx="14" fill="#dce5ed" stroke="#8499ad"/><path d="M0,-75 V75" stroke="#087f8c" stroke-dasharray="5 5"/><circle cx="-36" cy="-32" r="2.8" fill="#f0a343"/><circle cx="-36" cy="-28" r="2.8" fill="#f0a343"/><circle cx="-36" cy="-25" r="2.8" fill="#f0a343"/><circle cx="-36" cy="-22" r="2.8" fill="#f0a343"/><circle cx="-36" cy="-18" r="2.8" fill="#f0a343"/><circle cx="36" cy="-32" r="2.8" fill="#f0a343"/><circle cx="36" cy="-28" r="2.8" fill="#f0a343"/><circle cx="36" cy="-25" r="2.8" fill="#f0a343"/><circle cx="36" cy="-22" r="2.8" fill="#f0a343"/><circle cx="36" cy="-18" r="2.8" fill="#f0a343"/></g><path d="M574,240 L620,240" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="628" y="115" width="236" height="240" rx="14" fill="white" stroke="#dce5ed"/><text x="650" y="150" font-size="21" font-weight="bold" fill="#152c43">03  Approach</text><text x="650" y="182" font-size="16" font-weight="normal" fill="#5b7186">Align to the vehicle centerline</text><g transform="translate(748 265) rotate(-14)"><rect x="-35" y="-53" width="70" height="106" rx="14" fill="#dce5ed" stroke="#8499ad"/><path d="M0,-75 V75" stroke="#087f8c" stroke-dasharray="5 5"/><rect x="-48" y="-65" width="96" height="20" rx="4" fill="#087f8c"/></g><path d="M868,240 L914,240" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="922" y="115" width="236" height="240" rx="14" fill="white" stroke="#dce5ed"/><text x="944" y="150" font-size="21" font-weight="bold" fill="#152c43">04  Refine</text><text x="944" y="182" font-size="16" font-weight="normal" fill="#5b7186">Measure again and correct</text><g transform="translate(1042 265) rotate(-14)"><rect x="-35" y="-53" width="70" height="106" rx="14" fill="#dce5ed" stroke="#8499ad"/><path d="M0,-75 V75" stroke="#087f8c" stroke-dasharray="5 5"/><rect x="-48" y="-36" width="96" height="20" rx="4" fill="#087f8c"/></g><text x="40" y="393" font-size="21" font-weight="bold" fill="#087f8c">Longitudinal estimate:  (Q0.05 + Q0.95) / 2</text><text x="40" y="426" font-size="16" font-weight="normal" fill="#5b7186">Schematic only. Sensor geometry and motion are evaluated from recorded trials.</text></g></svg>