<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><rect width="1200" height="510" rx="18" fill="#f7fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker></defs><g font-family="Arial,DejaVu Sans,sans-serif"><text x="40" y="50" font-size="29" font-weight="bold" fill="#152c43">COUPLED VEHICLE + TWO-MODULE GEOMETRY</text><text x="40" y="83" font-size="18" font-weight="normal" fill="#5b7186">A route must clear the complete assembly, not only its reference point.</text><rect x="75" y="155" width="570" height="196" rx="38" fill="#dce5ed" stroke="#788fa4" stroke-width="3"/><rect x="195" y="183" width="300" height="140" rx="26" fill="#b8cbd9"/><rect x="137" y="133" width="56" height="240" rx="10" fill="#087f8c" opacity="0.8"/><rect x="527" y="133" width="56" height="240" rx="10" fill="#087f8c" opacity="0.8"/><rect x="60" y="120" width="600" height="265" rx="20" fill="none" stroke="#e2992f" stroke-width="3" stroke-dasharray="8 7"/><path d="M165,415 L555,415" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="257" y="446" font-size="19" font-weight="bold" fill="#087f8c">Module separation d</text><path d="M75,114 L645,114" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="280" y="110" font-size="17" font-weight="normal" fill="#087f8c">Vehicle length L</text><rect x="720" y="130" width="430" height="115" rx="14" fill="white" stroke="#dce5ed"/><text x="742" y="165" font-size="21" font-weight="bold" fill="#152c43">Parameterize the assembly</text><text x="742" y="197" font-size="16" font-weight="normal" fill="#5b7186">Vehicle length L and width W</text><text x="742" y="221" font-size="16" font-weight="normal" fill="#5b7186">Front / rear module separation d</text><rect x="720" y="270" width="430" height="128" rx="14" fill="white" stroke="#dce5ed"/><text x="742" y="305" font-size="21" font-weight="bold" fill="#152c43">Validate along the route</text><text x="742" y="337" font-size="16" font-weight="normal" fill="#5b7186">Whole-body clearance and swept envelope</text><text x="742" y="361" font-size="16" font-weight="normal" fill="#5b7186">Steering, wheel speed and acceleration</text><text x="75" y="480" font-size="15" font-weight="normal" fill="#5b7186">Illustrative geometry; not a manufacturer drawing or a dimensional specification.</text></g></svg>