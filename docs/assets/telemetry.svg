<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="475" viewBox="0 0 1200 475"><rect width="1200" height="475" rx="18" fill="#f7fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker></defs><g font-family="Arial,DejaVu Sans,sans-serif"><text x="40" y="50" font-size="29" font-weight="bold" fill="#152c43">TIME-ALIGNED STATE COMPARISON</text><text x="40" y="81" font-size="18" font-weight="normal" fill="#5b7186">Compare the same robot, reference point, coordinate frame and timestamp.</text><rect x="40" y="120" width="285" height="120" rx="14" fill="white" stroke="#dce5ed"/><text x="62" y="155" font-size="21" font-weight="bold" fill="#152c43">Robot estimate</text><text x="62" y="187" font-size="16" font-weight="normal" fill="#5b7186">Pose + measurement timestamp</text><text x="62" y="211" font-size="16" font-weight="normal" fill="#5b7186">Frame / map / robot identifiers</text><rect x="40" y="275" width="285" height="120" rx="14" fill="white" stroke="#dce5ed"/><text x="62" y="310" font-size="21" font-weight="bold" fill="#152c43">Simulation estimate</text><text x="62" y="342" font-size="16" font-weight="normal" fill="#5b7186">Pose history + simulation clock</text><text x="62" y="366" font-size="16" font-weight="normal" fill="#5b7186">Aligned reference point</text><path d="M325,180 L440,240" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M325,335 L440,270" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="450" y="190" width="285" height="150" rx="14" fill="white" stroke="#dce5ed"/><text x="472" y="225" font-size="21" font-weight="bold" fill="#152c43">Time correspondence</text><text x="472" y="257" font-size="16" font-weight="normal" fill="#5b7186">Interpolate position and heading</text><text x="472" y="281" font-size="16" font-weight="normal" fill="#5b7186">Validate clock and identity</text><text x="472" y="305" font-size="16" font-weight="normal" fill="#5b7186">Evaluate at matching time</text><path d="M735,265 L835,265" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="850" y="190" width="310" height="150" rx="14" fill="white" stroke="#dce5ed"/><text x="872" y="225" font-size="21" font-weight="bold" fill="#152c43">Error components</text><text x="872" y="257" font-size="16" font-weight="normal" fill="#5b7186">Longitudinal displacement</text><text x="872" y="281" font-size="16" font-weight="normal" fill="#5b7186">Lateral displacement</text><text x="872" y="305" font-size="16" font-weight="normal" fill="#5b7186">Wrapped heading difference</text><text x="450" y="390" font-size="19" font-weight="bold" fill="#087f8c">10 automated checks • Public Python evaluator</text><text x="40" y="446" font-size="16" font-weight="normal" fill="#5b7186">This diagram describes the evaluator; the public example uses synthetic input.</text></g></svg>