<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"><rect width="1200" height="380" rx="18" fill="#f7fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker></defs><g font-family="Arial,DejaVu Sans,sans-serif"><text x="40" y="51" font-size="29" font-weight="bold" fill="#152c43">SYSTEM ARCHITECTURE</text><text x="40" y="81" font-size="18" font-weight="normal" fill="#5b7186">Explicit interfaces between sensing, decision, motion and evaluation</text><rect x="40" y="120" width="235" height="155" rx="14" fill="white" stroke="#dce5ed"/><text x="62" y="155" font-size="21" font-weight="bold" fill="#152c43">01  SENSE</text><text x="62" y="187" font-size="16" font-weight="normal" fill="#5b7186">4 × 2D LiDAR</text><text x="62" y="211" font-size="16" font-weight="normal" fill="#5b7186">Left / right cameras</text><text x="62" y="235" font-size="16" font-weight="normal" fill="#5b7186">Timestamped robot pose</text><rect x="335" y="120" width="235" height="155" rx="14" fill="white" stroke="#dce5ed"/><text x="357" y="155" font-size="21" font-weight="bold" fill="#152c43">02  ESTIMATE</text><text x="357" y="187" font-size="16" font-weight="normal" fill="#5b7186">Tire / axle geometry</text><text x="357" y="211" font-size="16" font-weight="normal" fill="#5b7186">Per-bay evidence ledger</text><text x="357" y="235" font-size="16" font-weight="normal" fill="#5b7186">Vehicle heading</text><rect x="630" y="120" width="235" height="155" rx="14" fill="white" stroke="#dce5ed"/><text x="652" y="155" font-size="21" font-weight="bold" fill="#152c43">03  PLAN &amp; ACT</text><text x="652" y="187" font-size="16" font-weight="normal" fill="#5b7186">Centerline + refinement</text><text x="652" y="211" font-size="16" font-weight="normal" fill="#5b7186">Vehicle / module geometry</text><text x="652" y="235" font-size="16" font-weight="normal" fill="#5b7186">Wheel-command validation</text><rect x="925" y="120" width="235" height="155" rx="14" fill="white" stroke="#dce5ed"/><text x="947" y="155" font-size="21" font-weight="bold" fill="#152c43">04  EVALUATE</text><text x="947" y="187" font-size="16" font-weight="normal" fill="#5b7186">Final pose errors</text><text x="947" y="211" font-size="16" font-weight="normal" fill="#5b7186">Motion / observation time</text><text x="947" y="235" font-size="16" font-weight="normal" fill="#5b7186">Traceable state records</text><path d="M275,197 L327,197" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M570,197 L622,197" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M865,197 L917,197" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M748,276 L748,315 L157,315 L157,277" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="345" font-size="19" font-weight="bold" fill="#087f8c">Re-observe → update target → refine pose</text></g></svg>